[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cris-companion"
version = "0.1.0"
description = "Baseline scaffold for CRIS Companion"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
